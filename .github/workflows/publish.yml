name: Build and Publish Conda Package

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# cancel previous job if new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PKG_NAME: mantid-sphinx-theme
  MOD_NAME: mantid_sphinx_theme

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4

      - name: Build conda package
        run: |
          pixi build
          mkdir -p /tmp/local-channel/linux-64
          cp ${{ env.PKG_NAME }}-*.conda /tmp/local-channel/linux-64/

      - name: Verify Conda Package
        uses: neutrons/conda-verify@main
        with:
          python-version: "3.11"
          local-channel: /tmp/local-channel
          package-name: ${{ env.PKG_NAME }}
          module-name: ${{ env.MOD_NAME }}
          extra-commands: |
            which python
            python -c "import mantid_sphinx_theme"
            python -c "import pydata_sphinx_theme"

      # Upload the conda package for job "publish" to use later
      - name: upload conda package as artifact
        uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: artifact-conda-package
          path: ${{ env.PKG_NAME }}-*.conda

  # Publish the package as a separate job so that the Github Actions webpage
  # shows it as a separate step in the CI workflow
  publish:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4

      - name: Download conda package artifact
        uses: actions/download-artifact@v7
        with:
          name: artifact-conda-package

      - name: Upload package to anaconda
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          IS_RC: ${{ contains(github.ref, 'rc') }}
        run: |
          # label is main or rc depending on the tag-name
          CONDA_LABEL="main"
          if [ "${IS_RC}" = "true" ]; then CONDA_LABEL="rc"; fi
          echo pushing ${{ github.ref }} with label $CONDA_LABEL
          pixi run anaconda upload --label $CONDA_LABEL --user mantid ${{ env.PKG_NAME }}-*.conda
